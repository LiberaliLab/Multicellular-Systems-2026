  <text x="352" y="122" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#1f7a8c" text-anchor="start">Texas Red</text>
  <text x="444" y="122" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#5d6b85" text-anchor="start">_</text>
  <text x="456" y="122" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#1f7a8c" text-anchor="start">0</text>
  <text x="62" y="152" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#5d6b85" text-anchor="start">family</text>
  <text x="216" y="152" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#5d6b85" text-anchor="start">statistic</text>
  <text x="352" y="152" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#1f7a8c" text-anchor="start">channel</text>
  <text x="452" y="152" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#1f7a8c" text-anchor="start">round</text>
  <line x1="200" y1="170" x2="200" y2="200" stroke="#5d6b85" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="214" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6b85" text-anchor="start">look up (channel, round) in the staining sheet</text>
  <rect x="48" y="230" width="784" height="74" rx="5" fill="#f2f5fa" stroke="#d5deeb" stroke-width="1.2"/>
