# Rule: a group carries a `caption:` only when it has no landing page of its own.
# Parts 1-3 each have an intro page, so that page IS the header -- adding a caption
# would print the same title twice in the sidebar.
format: jb-book
root: landing

parts:
  - caption: Course information
    chapters:
      - file: course_schedule
      - file: setup/index
        sections:
          - file: setup/euler_jupyterhub
          - file: setup/python_environment
          - file: setup/data
          - file: setup/napari_local

  - chapters:
      - file: part1_omezarr/intro
        sections:
          - file: part1_omezarr/concept/intro
            sections:
              - file: part1_omezarr/concept/01_what_is_omezarr
          - file: part1_omezarr/ezzarr/intro
            sections:
              - file: part1_omezarr/ezzarr/02_ezzarr_quicklook
          - file: part1_omezarr/ngio/intro
            sections:
              - file: part1_omezarr/ngio/01_container
              - file: part1_omezarr/ngio/02_plates_wells
              - file: part1_omezarr/ngio/03_labels_tables
          - file: part1_omezarr/cheatsheet

      - file: part2_napari/intro
        sections:
          - file: part2_napari/01_napari_tour
          - file: part2_napari/02_omezarr_in_napari
          - file: part2_napari/exercises

      - file: part3_analysis/intro
        sections:
          - file: part3_analysis/1_preparation/intro
            sections:
              - file: part3_analysis/1_preparation/00_experiment_and_layout
              - file: part3_analysis/1_preparation/01_decode_and_slim
              - file: part3_analysis/1_preparation/02_qc_and_normalisation
          - file: part3_analysis/2_themes/intro
            sections:
              - file: part3_analysis/2_themes/03_signaling
              - file: part3_analysis/2_themes/04_mechanics
              - file: part3_analysis/2_themes/05_metabolism
              - file: part3_analysis/2_themes/06_organelles
          - file: part3_analysis/3_going_further/intro
            sections:
              - file: part3_analysis/3_going_further/07_celltypes_and_proportions
              - file: part3_analysis/3_going_further/08_integration

  - caption: Independent work
    chapters:
      - file: projects

  - caption: Further information
    chapters:
      - file: acknowledgements
      - file: further_reading
