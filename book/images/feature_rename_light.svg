  <line x1="200" y1="322" x2="200" y2="348" stroke="#5d6b85" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="48" y="354" width="470" height="40" rx="5" fill="#bfe0e6" stroke="#1f7a8c" stroke-width="1.8"/>
  <text x="64" y="380" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#1f7a8c" text-anchor="start">var['marker'] = 'Foxo3a'</text>
  <text x="300" y="380" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#16233d" text-anchor="start">var['theme'] = 'signaling'</text>
  <text x="544" y="380" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="start">3,654 of 4,464 columns get a marker this way</text>
