<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="880" height="366" role="img">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b85"/></marker></defs>
  <text x="48" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#16233d" text-anchor="start">The same image, stored at several resolutions</text>
  <text x="48" y="63" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6b85" text-anchor="start">to draw a thumbnail you read the smallest level, not the largest one downsampled</text>
  <rect x="60" y="70" width="176" height="176" rx="4" fill="#bfe0e6" stroke="#1f7a8c" stroke-width="1.8"/>
  <text x="148.0" y="270" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#16233d" text-anchor="middle">level 0</text>
  <text x="148.0" y="289" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">10000 × 10000</text>
  <text x="148.0" y="306" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">0.65 µm/px</text>
  <rect x="282" y="122" width="124" height="124" rx="4" fill="#dfe8f5" stroke="#b9c8de" stroke-width="1.2"/>
  <text x="344.0" y="270" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#16233d" text-anchor="middle">level 1</text>
  <text x="344.0" y="289" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">5000 × 5000</text>
  <text x="344.0" y="306" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">1.30 µm/px</text>
  <rect x="452" y="160" width="86" height="86" rx="4" fill="#dfe8f5" stroke="#b9c8de" stroke-width="1.2"/>
  <text x="495.0" y="270" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#16233d" text-anchor="middle">level 2</text>
  <text x="495.0" y="289" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">2500 × 2500</text>
  <text x="495.0" y="306" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">2.60 µm/px</text>
  <rect x="584" y="188" width="58" height="58" rx="4" fill="#dfe8f5" stroke="#b9c8de" stroke-width="1.2"/>
  <text x="613.0" y="270" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#16233d" text-anchor="middle">level 3</text>
  <text x="613.0" y="289" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">1250 × 1250</text>
  <text x="613.0" y="306" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5d6b85" text-anchor="middle">5.20 µm/px</text>
  <line x1="688" y1="150" x2="812" y2="150" stroke="#5d6b85" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="750" y="138" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6b85" text-anchor="middle">zoom out</text>
  <line x1="812" y1="178" x2="688" y2="178" stroke="#5d6b85" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="750" y="199" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6b85" text-anchor="middle">zoom in</text>
  <text x="48" y="350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6b85" text-anchor="start">each level is its own array of chunks; the whole pyramid costs about 33 % more than level 0 alone</text>
</svg>
