<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b85"/></marker></defs>
  <text x="48" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#16233d" text-anchor="start">Renaming a feature with its marker</text>
  <text x="48" y="63" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6b85" text-anchor="start">the column name carries the channel and the round; the sheet turns those into an antibody</text>
  <rect x="48" y="96" width="784" height="42" rx="5" fill="#f2f5fa" stroke="#d5deeb" stroke-width="1.2"/>
