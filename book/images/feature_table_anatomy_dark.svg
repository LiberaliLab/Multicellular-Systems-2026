<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" width="880" height="462" role="img">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb0c4"/></marker></defs>
  <text x="48" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">What you are given</text>
  <text x="48" y="63" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fb0c4" text-anchor="start">one AnnData object: a matrix, a row table, and a column table</text>
  <rect x="48" y="162" width="172" height="210" rx="5" fill="#161d28" stroke="#2b3646" stroke-width="1.2"/>
  <text x="58" y="152" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="start">obs — one row per cell</text>
  <text x="60" y="188" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">well_name</text>
  <text x="60" y="213" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">condition</text>
  <text x="60" y="238" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">timepoint_h</text>
  <text x="60" y="263" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">ROI</text>
  <text x="60" y="288" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">label</text>
  <text x="60" y="313" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">is_border_external</text>
  <text x="60" y="338" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">…</text>
  <text x="58" y="392" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#9fb0c4" text-anchor="start">733,556 rows × 12</text>
  <rect x="238" y="90" width="380" height="30" rx="5" fill="#43281a" stroke="#eb9a68" stroke-width="1.8"/>
  <text x="248" y="110" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#eb9a68" text-anchor="start">var — one row per feature</text>
  <text x="608" y="110" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#eb9a68" text-anchor="end">4,464 names and NOTHING ELSE</text>
  <rect x="238" y="162" width="380" height="210" rx="5" fill="#1d3f49" stroke="#5cc2d6" stroke-width="1.8"/>
  <text x="428.0" y="253.0" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="30" font-weight="700" fill="#5cc2d6" text-anchor="middle">X</text>
  <text x="428.0" y="281.0" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="middle">733,556 × 4,464   float32</text>
  <text x="428.0" y="303.0" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#9fb0c4" text-anchor="middle">13.1 GB dense</text>
  <text x="644" y="174" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#9fb0c4" text-anchor="start">no layers</text>
  <text x="644" y="196" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#9fb0c4" text-anchor="start">no obsm</text>
  <text x="644" y="218" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#9fb0c4" text-anchor="start">no uns</text>
  <text x="644" y="240" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#eb9a68" text-anchor="start">no var</text>
  <text x="644" y="262" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#eb9a68" text-anchor="start">columns</text>
  <text x="48" y="418" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="start">A column name says the channel and the imaging round — never the antibody.</text>
  <text x="48" y="440" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c4" text-anchor="start">Filling that empty var table is what Steps 7 to 9 do.</text>
</svg>
