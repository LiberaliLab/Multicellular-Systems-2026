  <text x="66" y="282" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1f7a8c" text-anchor="start">0</text>
  <text x="150" y="282" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1f7a8c" text-anchor="start">Texas Red</text>
  <text x="300" y="282" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1f7a8c" text-anchor="start">Foxo3a</text>
  <text x="500" y="282" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#16233d" text-anchor="start">500</text>
