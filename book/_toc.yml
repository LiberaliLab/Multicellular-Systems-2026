# Rule: a group carries a `caption:` only when it has no landing page of its own.
# Parts 1-3 each have an intro page, so that page IS the header -- adding a caption
# would print the same title twice in the sidebar.
format: jb-book
root: landing

parts:
  - caption: Course information
    chapters:
      - file: course_schedule
      - file: setup/index
        sections:
          - file: setup/euler_jupyterhub
          - file: setup/python_environment
          - file: setup/data

  - chapters:
      - file: part1_omezarr/intro
        sections:
          - file: part1_omezarr/concept/intro
            sections:
              - file: part1_omezarr/concept/01_what_is_omezarr
          - file: part1_omezarr/ezzarr/intro
            sections:
              - file: part1_omezarr/ezzarr/02_ezzarr_quicklook
          - file: part1_omezarr/ngio/intro
            sections:
              - file: part1_omezarr/ngio/01_container
              - file: part1_omezarr/ngio/02_plates_wells
              - file: part1_omezarr/ngio/03_labels_tables
          - file: part1_omezarr/cheatsheet

      - file: part2_features/intro
        sections:
          - file: part2_features/01_what_is_measured
          - file: part2_features/02_how_and_with_what

      - file: part3_analysis/intro
        sections:
          - file: part3_analysis/1_preparation/intro
            sections:
              - file: part3_analysis/1_preparation/00_what_you_are_given
              - file: part3_analysis/1_preparation/01_columns_to_markers
              - file: part3_analysis/1_preparation/02_quality_control
              - file: part3_analysis/1_preparation/03_normalisation
              - file: part3_analysis/1_preparation/04_subsetting_and_sketching
          - file: part3_analysis/2_controls/intro
            sections:
              - file: part3_analysis/2_controls/05_the_anndata_object
              - file: part3_analysis/2_controls/06_pca
              - file: part3_analysis/2_controls/07_umap
              - file: part3_analysis/2_controls/08_cell_type_annotation
              - file: part3_analysis/2_controls/09_paga
              - file: part3_analysis/2_controls/10_diffusion_map
          - file: part3_analysis/11_your_turn

      # --- Part 4: the solutions -------------------------------------------
      # TO WITHHOLD THEM: comment out the eight lines below, and the matching card
      # in landing.md, then push.
      # `only_build_toc_files: true` (in _config.yml) means these pages are then
      # never built, so they appear neither on the site nor in its search index.
      # The few "the answers are in Part 4" links in Part 3 quietly become plain
      # text; `suppress_warnings` in _config.yml is what stops that failing the
      # build. To release them again, delete the '#' characters and push --
      # and uncomment the "Part 4 - Solutions" card in landing.md, which is a
      # grid-item-card rather than an inline link and so does NOT degrade to
      # plain text on its own.
      # - file: part4_final_solutions/intro
      #   sections:
      #     - file: part4_final_solutions/00_full_dataset_analysis
      #     - file: part4_final_solutions/01_signaling
      #     - file: part4_final_solutions/02_mechanics
      #     - file: part4_final_solutions/03_metabolism
      #     - file: part4_final_solutions/04_organelles
      #     - file: part4_final_solutions/05_integration

  # Napari is optional and runs on a laptop rather than Euler, so it sits at the end
  # rather than interrupting the two computational parts. The folder is still named
  # part2_napari; renaming it would churn every link for no reader-visible gain.
  - caption: Optional
    chapters:
      - file: part2_napari/intro
        sections:
          - file: part2_napari/00_setup
          - file: part2_napari/01_napari_tour
          - file: part2_napari/02_omezarr_in_napari
          - file: part2_napari/exercises

  - caption: Independent work
    chapters:
      - file: projects

  - caption: Further information
    chapters:
      - file: acknowledgements
      - file: further_reading
