# Jupyter Book 1.x configuration.
# Build with:  jupyter-book build book/
title: Multicellular Systems 2026
author: Silvia Barbiero and Manuel I. Araujo Novoa
copyright: "2026, ETH Zurich"
only_build_toc_files: true

execute:
  # Notebooks are committed WITH their outputs. The site must build on a
  # GitHub runner that has neither the cluster data nor 64 GB of RAM, so
  # nothing is re-executed here.
  execute_notebooks: off

# No `repository:` block, and every button that would lead to one is off: students
# read the site and type the code, and nothing on a page points at the source repo.
html:
  use_issues_button: false
  use_repository_button: false
  use_edit_page_button: false
  home_page_in_navbar: false
  baseurl: https://liberalilab.github.io/Multicellular-Systems-2026/

parse:
  myst_enable_extensions:
    - colon_fence      # ::: fences, used for admonitions in notebooks
    - deflist
    - dollarmath
    - linkify
    - substitution

sphinx:
  config:
    html_show_copyright: true
    # Part 4 can be withheld by commenting it out of _toc.yml (see the note there).
    # When it is, the handful of "the answers are in Part 4" links elsewhere in the
    # book point at a document that was never built. Sphinx would fail the build on
    # that, so the class is suppressed and those links render as plain text instead.
    # Genuinely broken links are still caught -- tools/ checks every href and src in
    # the built HTML, which is a stronger test than this warning was.
    suppress_warnings:
      - ref.doc
      - myst.xref_missing
    # No per-page download of the notebook, and no copy of the sources published
    # under _sources/ either -- switching the button off alone would leave every
    # .ipynb one guessed URL away.
    html_copy_source: false
    html_show_sourcelink: false
    html_theme_options:
      use_download_button: false
  extra_extensions:
    - sphinx_togglebutton   # collapsible exercise solutions
