[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcs2026"
version = "0.1.0"
description = "Helpers for the Multicellular Systems 2026 hands-on course"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=2.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
